<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lusin — Beheer</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F5F1EB;--bg2:#EDE7DE;--white:#FDFBF8;--dark:#1A1A1A;--mid:#555;--light:#999;--rule:#D8CFBF;--warm:#B5956E;--green:#3d9a5c;--red:#c0392b}
body{font-family:"Space Grotesk",sans-serif;background:var(--bg);color:var(--dark);font-size:14px;min-height:100vh}
/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--white);border:.5px solid var(--rule);padding:3rem 2.5rem;width:100%;max-width:420px}
.login-logo{font-family:"Outfit",sans-serif;font-size:1.4rem;font-weight:200;letter-spacing:.1em;text-transform:uppercase}
.login-logo em{font-style:normal;color:var(--warm)}
.login-sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--light);margin-top:.2rem;margin-bottom:2.5rem}
.fl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--warm);margin-bottom:.4rem;margin-top:1.25rem;display:block}
input[type=password],input[type=text],textarea{width:100%;padding:.7rem .85rem;border:.5px solid var(--rule);background:var(--bg);font-family:"Space Grotesk",sans-serif;font-size:13px;color:var(--dark);outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--warm)}
textarea{resize:vertical;min-height:90px;line-height:1.65}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:.75rem 1.5rem;margin-top:1.5rem;border:.5px solid var(--dark);background:var(--dark);color:var(--white);font-family:"Space Grotesk",sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.btn:hover{background:#333}
.hint{font-size:11px;color:var(--light);margin-top:.4rem;line-height:1.5}
.hint a{color:var(--warm);text-decoration:none}
.err-msg{font-size:12px;color:var(--red);margin-top:.5rem;min-height:1.2em}
/* DASHBOARD */
#dashboard{display:none;min-height:100vh}
.topbar{position:fixed;top:0;left:0;right:0;z-index:200;height:56px;background:var(--white);border-bottom:.5px solid var(--rule);display:flex;align-items:center;justify-content:space-between;padding:0 2rem}
.topbar-logo{font-family:"Outfit",sans-serif;font-size:1rem;font-weight:200;letter-spacing:.12em;text-transform:uppercase}
.topbar-logo em{font-style:normal;color:var(--warm)}
.topbar-right{display:flex;align-items:center;gap:1rem}
.cdot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.ctext{font-size:11px;color:var(--light)}
.logout-btn{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--light);cursor:pointer;background:none;border:none;font-family:inherit}
.logout-btn:hover{color:var(--dark)}
.layout{display:grid;grid-template-columns:220px 1fr;margin-top:56px;min-height:calc(100vh - 56px)}
/* SIDEBAR */
.sidebar{background:var(--white);border-right:.5px solid var(--rule);padding:1.5rem 0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.sg{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--light);padding:0 1.3rem;margin-bottom:.3rem;margin-top:1rem}
.sg:first-child{margin-top:0}
.sl{display:flex;align-items:center;gap:.5rem;padding:.6rem 1.3rem;font-size:13px;color:var(--mid);cursor:pointer;border-left:2px solid transparent;transition:all .18s;text-decoration:none;user-select:none}
.sl:hover{color:var(--dark);background:var(--bg)}
.sl.active{color:var(--dark);border-left-color:var(--warm);background:var(--bg);font-weight:500}
.sl.sub{padding-left:2.2rem;font-size:12px}
hr.sd{border:none;border-top:.5px solid var(--rule);margin:.6rem 0}
/* MAIN */
.main{padding:2.5rem 3rem 8rem;max-width:800px}
.ph1{font-family:"Outfit",sans-serif;font-size:1.75rem;font-weight:200;letter-spacing:-.01em;margin-bottom:.2rem}
.psub{font-size:12px;color:var(--light);margin-bottom:2.5rem}
.sh{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--warm);margin-top:2rem;margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:.5px solid var(--rule)}
.fg{margin-bottom:1rem}
.fg label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);display:block;margin-bottom:.4rem}
.tc{display:grid;grid-template-columns:1fr 2fr;gap:.9rem}
/* IMG FIELDS */
.if{margin-bottom:1.2rem}
.if>label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);display:block;margin-bottom:.5rem}
.ip{width:100%;height:160px;object-fit:cover;border:.5px solid var(--rule);display:block;background:var(--bg2)}
.ip.ph{display:flex;align-items:center;justify-content:center;color:var(--light);font-size:11px;letter-spacing:.08em}
.ia{display:flex;align-items:center;gap:.75rem;margin-top:.5rem}
.fl2{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem 1rem;border:.5px solid var(--rule);background:var(--bg);font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .18s;white-space:nowrap}
.fl2:hover{background:var(--bg2)}
.fl2 input[type=file]{display:none}
.us{font-size:11px;color:var(--light)}
/* PUBLISH */
.pb{position:fixed;bottom:0;left:220px;right:0;z-index:100;background:var(--dark);padding:.85rem 2.5rem;display:flex;align-items:center;justify-content:space-between}
.ps{font-size:11px;color:rgba(255,255,255,.4)}
.pbtn{display:flex;align-items:center;gap:.5rem;padding:.6rem 1.75rem;background:var(--warm);border:none;color:white;font-family:"Space Grotesk",sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.pbtn:hover:not(:disabled){background:#a3845e}
.pbtn:disabled{background:#555;cursor:not-allowed;opacity:.7}
/* TOAST */
.toast{position:fixed;top:68px;right:1.5rem;z-index:999;padding:.7rem 1.2rem;font-size:12px;color:white;transform:translateX(130%);transition:transform .3s ease}
.toast.v{transform:translateX(0)}
.toast.ok{background:var(--green)}
.toast.fail{background:var(--red)}
.lmsg{padding:3rem;color:var(--light);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto}.main{padding:1.5rem 1.25rem 7rem}.pb{left:0}.tc{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Lusin <em>Agency</em></div>
    <div class="login-sub">Beheer paneel</div>
    <label class="fl">Wachtwoord</label>
    <input type="password" id="pwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    <label class="fl">GitHub Token</label>
    <input type="password" id="tok" placeholder="github_pat_..." onkeydown="if(event.key==='Enter')login()">
    <p class="hint">Wordt opgeslagen in je browser — hoef je maar één keer in te vullen.<br>
    <a href="https://github.com/settings/tokens/new?scopes=repo&description=LusinAdmin" target="_blank">Nieuw token aanmaken →</a></p>
    <div class="err-msg" id="err"></div>
    <button class="btn" onclick="login()">Inloggen</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-logo">Lusin <em>Admin</em></div>
    <div class="topbar-right">
      <div class="cdot"></div>
      <span class="ctext">Verbonden</span>
      <button class="logout-btn" onclick="logout()">Uitloggen</button>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="sg">Website</div>
      <div class="sl active" data-tab="home-hero" onclick="go(this)">🏠 Home — Hero</div>
      <div class="sl sub" data-tab="home-about" onclick="go(this)">Over ons</div>
      <div class="sl sub" data-tab="home-services" onclick="go(this)">Services</div>
      <div class="sl sub" data-tab="home-packages" onclick="go(this)">Pakketten</div>
      <hr class="sd">
      <div class="sg">Cases</div>
      <div class="sl" data-tab="cases-overview" onclick="go(this)">📂 Overzicht</div>
      <div id="case-tabs"><!-- auto-filled --></div>
      <hr class="sd">
      <div class="sg">Links</div>
      <a class="sl" href="https://lusinagency.nl" target="_blank">↗ Bekijk site</a>
      <a class="sl" href="https://lusinagency.nl/cases" target="_blank">↗ Cases</a>
    </div>
    <div class="main" id="main">
      <div class="lmsg">Laden…</div>
    </div>
  </div>

  <div class="pb">
    <span class="ps" id="pstat">Geen wijzigingen</span>
    <button class="pbtn" id="pbtn" disabled onclick="publish()">Publiceren op site</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const REPO = 'studiolusin-bit/lusin-agency';
const API  = `https://api.github.com/repos/${REPO}/contents/`;
const PWD  = 'lusin2026';

// ── STATE ────────────────────────────────────────────────────────────────────
let token = '';
let cache = {};      // path → {content, sha}
let dirty = {};      // path → new content

// ── AUTH ─────────────────────────────────────────────────────────────────────
function login() {
  const p = document.getElementById('pwd').value;
  const t = document.getElementById('tok').value.trim();
  if (p !== PWD) { document.getElementById('err').textContent = 'Onjuist wachtwoord.'; return; }
  if (!t)        { document.getElementById('err').textContent = 'Voer je GitHub token in.'; return; }
  token = t;
  localStorage.setItem('lt', t);
  localStorage.setItem('la', '1');
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  init();
}
function logout() { localStorage.removeItem('lt'); localStorage.removeItem('la'); location.reload(); }

window.addEventListener('load', () => {
  const t = localStorage.getItem('lt');
  if (t) document.getElementById('tok').value = t;
  if (t && localStorage.getItem('la')) {
    token = t;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    init();
  }
});

// ── GITHUB API ────────────────────────────────────────────────────────────────
async function ghGet(path) {
  if (cache[path]) return cache[path];
  const r = await fetch(API + path, { headers: { Authorization: `Bearer ${token}` } });
  if (!r.ok) throw new Error(`Kan ${path} niet laden (${r.status})`);
  const d = await r.json();
  const content = decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))));
  cache[path] = { content, sha: d.sha };
  return cache[path];
}
async function ghPut(path, content, sha, msg) {
  const b64 = btoa(unescape(encodeURIComponent(content)));
  const r = await fetch(API + path, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: msg, content: b64, sha })
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message || 'Opslaan mislukt'); }
  const d = await r.json();
  cache[path] = { content, sha: d.content.sha };
}

// ── MARKER HELPERS ────────────────────────────────────────────────────────────
function extract(html, key) {
  const m = html.match(new RegExp(`<!--\\s*§${key}§\\s*-->(.*?)<!--\\s*§/${key}§\\s*-->`, 's'));
  return m ? m[1].trim() : '';
}
function inject(html, key, val) {
  return html.replace(
    new RegExp(`(<!--\\s*§${key}§\\s*-->)(.*?)(<!--\\s*§/${key}§\\s*-->)`, 's'),
    `$1${val}$3`
  );
}
function extractImg(html, editKey) {
  const m = html.match(new RegExp(`<img[^>]*data-edit="${editKey}"[^>]*src="([^"]*)"`, 's'))
         || html.match(new RegExp(`<img[^>]*src="([^"]*)"[^>]*data-edit="${editKey}"`, 's'));
  return m ? m[1] : '';
}
function injectImg(html, editKey, src) {
  let r = html.replace(new RegExp(`(<img[^>]*data-edit="${editKey}"[^>]*src=")([^"]*)(")`), `$1${src}$3`);
  r = r.replace(new RegExp(`(<img[^>]*src=")([^"]*)("[^>]*data-edit="${editKey}")`), `$1${src}$3`);
  if (src) {
    r = r.replace(new RegExp(`(<img[^>]*data-edit="${editKey}"[^>]*) style="display:none"`), `$1`);
    r = r.replace(new RegExp(`(<img[^>]*) style="display:none"([^>]*data-edit="${editKey}")`), `$1$2`);
  }
  return r;
}

// Auto-scan all §markers§ from a file
function scanMarkers(html) {
  const re = /<!--\s*§([\w-]+)§\s*-->([\s\S]*?)<!--\s*§\/[\w-]+§\s*-->/g;
  const out = [];
  let m;
  while ((m = re.exec(html)) !== null) {
    out.push({ key: m[1], val: m[2].trim() });
  }
  return out;
}
// Auto-scan data-edit images
function scanImgs(html) {
  const re = /<img[^>]*data-edit="([\w-]+)"[^>]*src="([^"]*)"/g;
  const out = [];
  let m;
  while ((m = re.exec(html)) !== null) out.push({ key: m[1], src: m[2] });
  const re2 = /<img[^>]*src="([^"]*)"[^>]*data-edit="([\w-]+)"/g;
  while ((m = re2.exec(html)) !== null) {
    if (!out.find(x => x.key === m[2])) out.push({ key: m[2], src: m[1] });
  }
  return out;
}

// ── CHANGE TRACKING ───────────────────────────────────────────────────────────
function markDirty(fp) {
  document.querySelectorAll(`[data-field][data-fp="${fp}"]`).forEach(el => {
    cache[fp].content = inject(cache[fp].content, el.dataset.field, el.value);
  });
  dirty[fp] = cache[fp].content;
  document.getElementById('pstat').textContent = 'Wijzigingen nog niet gepubliceerd';
  document.getElementById('pstat').style.color = 'rgba(255,200,100,.9)';
  document.getElementById('pbtn').disabled = false;
}

// ── HTML BUILDERS ─────────────────────────────────────────────────────────────
function F(fp, key, label, big, val) {
  const attrs = `data-field="${key}" data-fp="${fp}" oninput="markDirty('${fp}')"`;
  const v = val.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  if (big) return `<div class="fg"><label>${label}</label><textarea ${attrs}>${v}</textarea></div>`;
  return `<div class="fg"><label>${label}</label><input type="text" ${attrs} value="${v}"></div>`;
}
function I(fp, editKey, label, src, prefix) {
  const rawSrc = src && src !== ''
    ? `https://raw.githubusercontent.com/${REPO}/main/${src.replace(/^(\.\.\/)+/,'')}`
    : '';
  const img = rawSrc
    ? `<img class="ip" id="prev-${editKey}" src="${rawSrc}" onerror="this.className='ip ph';this.removeAttribute('src')">`
    : `<div class="ip ph" id="prev-${editKey}">Geen foto — klik om te uploaden</div>`;
  return `<div class="if"><label>${label}</label>${img}
  <div class="ia"><label class="fl2">📷 Kies foto<input type="file" accept="image/*" onchange="uploadImg(event,'${editKey}','${fp}','${prefix}')"></label>
  <span class="us" id="us-${editKey}"></span></div></div>`;
}

// Pretty label from key
function keyLabel(key) {
  return key.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}

// ── INIT — discover cases ─────────────────────────────────────────────────────
async function init() {
  try {
    const f = await ghGet('cases.html');
    const matches = [...f.content.matchAll(/<a href="cases\/([\w-]+)\.html"[^>]*class="case-row"[\s\S]*?<h2 class="case-client">([\s\S]*?)<\/h2>/g)];
    const caseTabs = document.getElementById('case-tabs');
    caseTabs.innerHTML = '';
    matches.forEach(([,slug,rawName]) => {
      const name = rawName.replace(/<[^>]+>/g,'').trim();
      const tab = document.createElement('div');
      tab.className = 'sl sub';
      tab.dataset.tab = `case:${slug}`;
      tab.textContent = name;
      tab.onclick = () => go(tab);
      caseTabs.appendChild(tab);
    });
  } catch(e) { console.warn('Could not discover cases:', e); }
  go(document.querySelector('.sl.active'));
}

// ── TAB SWITCHER ──────────────────────────────────────────────────────────────
async function go(el) {
  if (!el) return;
  document.querySelectorAll('.sl').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  const tab = el.dataset.tab;
  document.getElementById('main').innerHTML = '<div class="lmsg">Laden…</div>';
  try {
    if (tab === 'home-hero')     await renderHomeHero();
    else if (tab === 'home-about')    await renderHomeAbout();
    else if (tab === 'home-services') await renderHomeServices();
    else if (tab === 'home-packages') await renderHomePackages();
    else if (tab === 'cases-overview') await renderCasesOverview();
    else if (tab.startsWith('case:')) await renderCase(tab.slice(5));
  } catch(e) {
    document.getElementById('main').innerHTML =
      `<div class="lmsg" style="color:var(--red)">Fout: ${e.message}<br><small>Is je token geldig met repo-toegang?</small></div>`;
  }
}

// ── HOME SECTIONS ─────────────────────────────────────────────────────────────
async function renderHomeHero() {
  const fp = 'index.html';
  const {content:h} = await ghGet(fp);
  document.getElementById('main').innerHTML = `
    <h1 class="ph1">Home — Hero tekst</h1>
    <p class="psub">De grote tekst bovenaan je homepagina</p>
    <div class="sh">Grote kop</div>
    ${F(fp,'hero-nl-1','Regel 1',false,extract(h,'hero-nl-1'))}
    ${F(fp,'hero-nl-2','Regel 2',false,extract(h,'hero-nl-2'))}
    ${F(fp,'hero-sub-nl','Subtekst',true,extract(h,'hero-sub-nl'))}
    <div style="height:3rem"></div>`;
}
async function renderHomeAbout() {
  const fp = 'index.html';
  const {content:h} = await ghGet(fp);
  document.getElementById('main').innerHTML = `
    <h1 class="ph1">Home — Over ons</h1>
    <p class="psub">De tekst in het Over ons gedeelte</p>
    <div class="sh">Tekst</div>
    ${F(fp,'about-p1','Alinea 1',true,extract(h,'about-p1'))}
    ${F(fp,'about-p2','Alinea 2',true,extract(h,'about-p2'))}
    <div style="height:3rem"></div>`;
}
async function renderHomeServices() {
  const fp = 'index.html';
  const {content:h} = await ghGet(fp);
  document.getElementById('main').innerHTML = `
    <h1 class="ph1">Home — Services</h1>
    <p class="psub">Naam en omschrijving van elke service</p>
    <div class="sh">Service 1</div>
    ${F(fp,'svc-1-title','Naam',false,extract(h,'svc-1-title'))}
    ${F(fp,'svc-1-desc','Omschrijving',true,extract(h,'svc-1-desc'))}
    <div class="sh">Service 2</div>
    ${F(fp,'svc-2-title','Naam',false,extract(h,'svc-2-title'))}
    ${F(fp,'svc-2-desc','Omschrijving',true,extract(h,'svc-2-desc'))}
    <div class="sh">Service 3</div>
    ${F(fp,'svc-3-title','Naam',false,extract(h,'svc-3-title'))}
    ${F(fp,'svc-3-desc','Omschrijving',true,extract(h,'svc-3-desc'))}
    <div class="sh">Service 4</div>
    ${F(fp,'svc-4-title','Naam',false,extract(h,'svc-4-title'))}
    ${F(fp,'svc-4-desc','Omschrijving',true,extract(h,'svc-4-desc'))}
    <div style="height:3rem"></div>`;
}
async function renderHomePackages() {
  const fp = 'index.html';
  const {content:h} = await ghGet(fp);
  document.getElementById('main').innerHTML = `
    <h1 class="ph1">Home — Pakketten</h1>
    <p class="psub">Prijzen van de drie pakketten (alleen het getal, zonder €)</p>
    <div class="sh">Prijzen</div>
    <div class="tc">
      ${F(fp,'pkg-light-price','Light (€)',false,extract(h,'pkg-light-price'))}
      ${F(fp,'pkg-standard-price','Standard (€)',false,extract(h,'pkg-standard-price'))}
    </div>
    ${F(fp,'pkg-full-price','Full (€)',false,extract(h,'pkg-full-price'))}
    <div style="height:3rem"></div>`;
}

// ── CASES OVERVIEW ────────────────────────────────────────────────────────────
async function renderCasesOverview() {
  const fp = 'cases.html';
  const {content:h} = await ghGet(fp);
  const markers = scanMarkers(h);
  let fields = '';
  // Group by prefix
  fields += `<div class="sh">Pagina intro</div>`;
  fields += F(fp,'cases-sub','Ondertitel',true,extract(h,'cases-sub'));
  // Find all case cards: cases-XXX-tag and cases-XXX-desc
  const caseKeys = [...new Set(markers.map(m => m.key.match(/^cases-([\w-]+)-(tag|desc)$/)?.[1]).filter(Boolean))];
  caseKeys.forEach(slug => {
    const name = slug.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    fields += `<div class="sh">${name} kaart</div>`;
    fields += F(fp,`cases-${slug}-tag`,'Tag',false,extract(h,`cases-${slug}-tag`).replace(/&middot;/g,'·'));
    fields += F(fp,`cases-${slug}-desc`,'Beschrijving',true,extract(h,`cases-${slug}-desc`));
  });
  document.getElementById('main').innerHTML = `
    <h1 class="ph1">Cases overzicht</h1>
    <p class="psub">Teksten op de cases-pagina en kaarten</p>
    ${fields}
    <div style="height:3rem"></div>`;
}

// ── CASE PAGE (auto-generated) ────────────────────────────────────────────────
async function renderCase(slug) {
  const fp = `cases/${slug}.html`;
  const {content:h} = await ghGet(fp);

  // Extract title from case-hero-title
  const titleMatch = h.match(/<h1 class="case-hero-title">([\s\S]*?)<\/h1>/);
  const name = titleMatch ? titleMatch[1].trim() : slug;

  const markers = scanMarkers(h);
  const imgs    = scanImgs(h);

  // Group markers into sections
  const prefix = slug.replace(/-/g,'').slice(0,2);
  let fields = '';
  
  // Text markers
  const textMarkers = markers.filter(m => !m.key.includes('label') && !m.key.includes('num') && !m.key.includes('r1') && !m.key.includes('r2') && !m.key.includes('r3'));
  const resultMarkers = markers.filter(m => m.key.match(/r[123]-(num|label)/));
  const otherMarkers = markers.filter(m => !textMarkers.includes(m) && !resultMarkers.includes(m));

  if (textMarkers.length) {
    fields += `<div class="sh">Tekst</div>`;
    textMarkers.forEach(({key,val}) => {
      const big = val.length > 80 || key.includes('body') || key.includes('text');
      fields += F(fp, key, keyLabel(key), big, val);
    });
  }
  if (resultMarkers.length) {
    fields += `<div class="sh">Resultaten</div>`;
    // Pair nums + labels
    for (let i=1;i<=3;i++) {
      const numK = markers.find(m=>m.key.endsWith(`r${i}-num`));
      const labK = markers.find(m=>m.key.endsWith(`r${i}-label`));
      if (numK||labK) {
        fields += `<div class="tc">`;
        if (numK) fields += F(fp,numK.key,'Getal',false,numK.val);
        if (labK) fields += F(fp,labK.key,'Label',false,labK.val.replace(/<br>/g,' '));
        fields += `</div>`;
      }
    }
  }
  if (imgs.length) {
    fields += `<div class="sh">Foto's</div>`;
    imgs.forEach(({key,src}) => {
      fields += I(fp, key, keyLabel(key), src, '../');
    });
  }

  document.getElementById('main').innerHTML = `
    <h1 class="ph1">${name}</h1>
    <p class="psub">Case pagina — tekst en foto's aanpassen</p>
    ${fields}
    <div style="height:3rem"></div>`;
}

// ── IMAGE UPLOAD ──────────────────────────────────────────────────────────────
async function uploadImg(ev, editKey, fp, prefix) {
  const file = ev.target.files[0];
  if (!file) return;
  const st = document.getElementById(`us-${editKey}`);
  st.textContent = 'Uploaden…'; st.style.color='var(--warm)';
  try {
    const b64 = await new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file);});
    const gp = 'images/' + file.name;
    let sha;
    try { const c=await fetch(API+gp,{headers:{Authorization:`Bearer ${token}`}});if(c.ok){const d=await c.json();sha=d.sha;} } catch(_){}
    const body = { message:`Upload: ${file.name}`, content:b64 };
    if (sha) body.sha = sha;
    const r = await fetch(API+gp,{method:'PUT',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if (!r.ok) throw new Error('Upload mislukt');
    const newSrc = prefix + gp;
    cache[fp].content = injectImg(cache[fp].content, editKey, newSrc);
    dirty[fp] = cache[fp].content;
    // Auto-sync feed/split images to cases overview card
    const syncMap = {'ys-split':'cases-ys-img','ek-split':'cases-ek-img','dm-hero':'cases-dm-img','sb-split':'cases-sb-img'};
    if (syncMap[editKey]) {
      const casesFp = 'cases.html';
      if (!cache[casesFp]) await ghGet(casesFp);
      cache[casesFp].content = injectImg(cache[casesFp].content, syncMap[editKey], gp);
      dirty[casesFp] = cache[casesFp].content;
    }
    const prev = document.getElementById(`prev-${editKey}`);
    if (prev) { prev.src = URL.createObjectURL(file); prev.className='ip'; }
    st.textContent = `✓ ${file.name}`; st.style.color='var(--green)';
    document.getElementById('pstat').textContent='Wijzigingen nog niet gepubliceerd';
    document.getElementById('pstat').style.color='rgba(255,200,100,.9)';
    document.getElementById('pbtn').disabled=false;
  } catch(e) { st.textContent=`✗ ${e.message}`; st.style.color='var(--red)'; }
}

// ── PUBLISH ───────────────────────────────────────────────────────────────────
async function publish() {
  const btn = document.getElementById('pbtn');
  btn.disabled=true; btn.textContent='Bezig…';
  try {
    for (const [path,content] of Object.entries(dirty)) {
      await ghPut(path, content, cache[path].sha, 'Bijgewerkt via Lusin Admin');
    }
    dirty = {};
    toast('✓ Live! Kan 1–2 min duren om te verschijnen.','ok');
    document.getElementById('pstat').textContent='Gepubliceerd ✓';
    document.getElementById('pstat').style.color='rgba(100,220,120,.9)';
    setTimeout(()=>{document.getElementById('pstat').textContent='Geen wijzigingen';document.getElementById('pstat').style.color='rgba(255,255,255,.4)';btn.textContent='Publiceren op site';btn.disabled=true;},5000);
  } catch(e) { toast(`Fout: ${e.message}`,'fail'); btn.disabled=false; btn.textContent='Publiceren op site'; }
}
function toast(msg,type){const el=document.getElementById('toast');el.textContent=msg;el.className=`toast ${type} v`;setTimeout(()=>el.classList.remove('v'),5000);}
</script>
